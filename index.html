<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes courses</title>
<style>
  :root { --vert:#2e7d4f; --gris:#f3f4f2; --bord:#d9ddd6; --texte:#222; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; font-size:12pt; color:var(--texte); background:#fff; }
  header { background:var(--vert); color:#fff; padding:14px 16px; font-size:16pt; font-weight:600; }
  .onglets { display:flex; border-bottom:1px solid var(--bord); }
  .onglets button { flex:1; padding:12px; font-size:12pt; border:none; background:var(--gris); cursor:pointer; }
  .onglets button.actif { background:#fff; font-weight:600; border-bottom:3px solid var(--vert); }
  main { padding:12px 16px 80px; max-width:640px; margin:0 auto; }
  .panneau { display:none; } .panneau.actif { display:block; }
  h2 { font-size:12pt; margin:18px 0 6px; padding:6px 10px; background:var(--gris); border-left:4px solid var(--vert); }
  label.produit { display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--gris); cursor:pointer; }
  label.produit input { width:22px; height:22px; accent-color:var(--vert); }
  label.produit.coche span { font-weight:600; color:var(--vert); }
  .ligne { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
  input[type=text], select { flex:1; min-width:140px; padding:10px; font-size:12pt; border:1px solid var(--bord); border-radius:6px; }
  button.action { padding:10px 14px; font-size:12pt; border:none; border-radius:6px; background:var(--vert); color:#fff; cursor:pointer; }
  button.secondaire { background:#fff; color:var(--vert); border:1px solid var(--vert); }
  .item { display:flex; justify-content:space-between; align-items:center; padding:8px 4px; border-bottom:1px solid var(--gris); }
  .item button { border:none; background:none; color:#b3261e; font-size:12pt; cursor:pointer; }
  .compteur { margin:10px 0; font-weight:600; }
  #msg { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 16px; border-radius:6px; display:none; }
  .vide { color:#777; font-style:italic; padding:6px 4px; }
  textarea { width:100%; min-height:180px; padding:10px; font-size:12pt; font-family:inherit; border:1px solid var(--bord); border-radius:6px; }
  .ing { display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--gris); flex-wrap:wrap; }
  .ing input[type=checkbox] { width:22px; height:22px; accent-color:var(--vert); }
  .ing .nomIng { flex:1; min-width:120px; }
  .ing select { flex:0 1 200px; min-width:140px; padding:6px; }
  .deja { color:var(--vert); font-size:10pt; font-style:italic; }
  .attente { padding:12px 4px; color:#555; }
  .rec { display:flex; justify-content:space-between; align-items:center; padding:6px 4px; border-bottom:1px solid var(--gris); }
  .rec button.nomRec { flex:1; text-align:left; background:none; border:none; font-size:12pt; padding:6px 0; cursor:pointer; color:var(--texte); }
  .rec button.nomRec.ouverte { font-weight:600; color:var(--vert); }
  .rec button.suppr { border:none; background:none; color:#b3261e; font-size:12pt; cursor:pointer; }
  .detail { margin:6px 0 16px; padding:8px 10px; border:1px solid var(--bord); border-radius:6px; }
</style>
</head>
<body>
<header>🛒 Mes courses</header>
<div class="onglets">
  <button id="btnSemaine" class="actif" onclick="onglet('semaine')">Ma semaine</button>
  <button id="btnProduits" onclick="onglet('produits')">Mes produits</button>
  <button id="btnRecette" onclick="onglet('recette')">Recette</button>
</div>
<main>
  <section id="semaine" class="panneau actif">
    <div class="compteur" id="compteur"></div>
    <div class="ligne">
      <input type="text" id="exceptNom" placeholder="Article exceptionnel…">
      <select id="exceptRayon"></select>
      <button class="action" onclick="ajouter(true)">Ajouter</button>
    </div>
    <div id="listeSemaine"></div>
    <div class="ligne" style="margin-top:24px">
      <button class="action secondaire" onclick="coursesFaites()">✔ Courses faites (tout décocher)</button>
    </div>
  </section>
  <section id="produits" class="panneau">
    <div class="ligne">
      <input type="text" id="nouveauNom" placeholder="Nom du produit">
      <select id="nouveauRayon"></select>
      <button class="action" onclick="ajouter(false)">Ajouter</button>
    </div>
    <div id="listeProduits"></div>
  </section>
  <section id="recette" class="panneau">
    <h2>Mes recettes</h2>
    <div id="listeRecettes"></div>
    <div id="detailRecette"></div>

    <h2>Nouvelle recette</h2>
    <div class="ligne">
      <input type="text" id="nomRecette" placeholder="Nom de la recette (pour la retrouver plus tard)">
    </div>
    <textarea id="texteRecette" placeholder="Colle ta recette ici…"></textarea>
    <div class="ligne">
      <button class="action" id="btnExtraire" onclick="extraire()">Extraire les ingrédients</button>
    </div>
    <div id="resultatRecette"></div>
    <div class="ligne" id="zoneAjout" style="display:none">
      <button class="action" onclick="ajouterRecette()">Ajouter à ma semaine</button>
    </div>
  </section>
</main>
<div id="msg"></div>
<script>
// ====== À REMPLIR (2 valeurs) ======
const SUPABASE_URL = "https://dwkalolzdicnrjaqruij.supabase.co";
const SUPABASE_KEY = "sb_publishable_QNCe2A2C5Chv8Uy-edokzg_dvCQjyOb";
const WEBHOOK_RECETTE = "https://n8n.hebreu-zen.cloud/webhook/courses-recette";
// ===================================

const H = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
if (SUPABASE_KEY.startsWith("eyJ")) H.Authorization = "Bearer " + SUPABASE_KEY;
let rayons = [], produits = [], recettes = [], recetteOuverte = null;

async function api(chemin, options = {}) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + chemin, { ...options, headers: { ...H, ...(options.headers || {}) } });
  if (!r.ok) { const t = await r.text(); message("Erreur : " + t); throw new Error(t); }
  const texte = await r.text();
  return texte ? JSON.parse(texte) : null;
}

function message(t) { const m = document.getElementById("msg"); m.textContent = t; m.style.display = "block"; setTimeout(() => m.style.display = "none", 2500); }

function onglet(nom) {
  ["semaine", "produits", "recette"].forEach(n => {
    document.getElementById(n).classList.toggle("actif", n === nom);
    document.getElementById("btn" + n.charAt(0).toUpperCase() + n.slice(1)).classList.toggle("actif", n === nom);
  });
}

async function charger() {
  rayons = await api("rayons?select=*&order=ordre");
  produits = await api("produits?select=*&order=nom");
  const opts = rayons.map(r => `<option value="${r.id}">${r.nom}</option>`).join("");
  document.getElementById("nouveauRayon").innerHTML = opts;
  document.getElementById("exceptRayon").innerHTML = opts;
  afficher();
  await chargerRecettes();
}

function echap(t) { return t.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }

function afficher() {
  let s = "", p = "";
  rayons.forEach(r => {
    const liste = produits.filter(x => x.rayon_id === r.id);
    s += `<h2>${r.nom}</h2>`;
    p += `<h2>${r.nom}</h2>`;
    if (!liste.length) { s += `<div class="vide">—</div>`; p += `<div class="vide">Aucun produit</div>`; return; }
    liste.forEach(x => {
      s += `<label class="produit ${x.manque ? "coche" : ""}"><input type="checkbox" ${x.manque ? "checked" : ""} onchange="basculer(${x.id}, this.checked)"><span>${echap(x.nom)}</span></label>`;
      p += `<div class="item"><span>${echap(x.nom)}</span><button onclick="supprimer(${x.id})">🗑</button></div>`;
    });
  });
  document.getElementById("listeSemaine").innerHTML = s;
  document.getElementById("listeProduits").innerHTML = p;
  const n = produits.filter(x => x.manque).length;
  document.getElementById("compteur").textContent = n ? `${n} produit(s) à acheter` : "Rien à acheter pour l'instant";
}

async function basculer(id, etat) {
  await api("produits?id=eq." + id, { method: "PATCH", body: JSON.stringify({ manque: etat }) });
  produits.find(x => x.id === id).manque = etat;
  afficher();
}

async function ajouter(exceptionnel) {
  const champ = document.getElementById(exceptionnel ? "exceptNom" : "nouveauNom");
  const rayon = document.getElementById(exceptionnel ? "exceptRayon" : "nouveauRayon").value;
  const nom = champ.value.trim();
  if (!nom) return;
  const res = await api("produits", { method: "POST", headers: { Prefer: "return=representation" },
    body: JSON.stringify({ nom, rayon_id: Number(rayon), manque: exceptionnel }) });
  produits.push(res[0]);
  produits.sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
  champ.value = "";
  afficher();
  message("Ajouté : " + nom);
}

async function supprimer(id) {
  const x = produits.find(p => p.id === id);
  if (!confirm("Supprimer « " + x.nom + " » ?")) return;
  await api("produits?id=eq." + id, { method: "DELETE" });
  produits = produits.filter(p => p.id !== id);
  afficher();
}

async function coursesFaites() {
  if (!confirm("Tout décocher ? (courses faites)")) return;
  await api("produits?manque=eq.true", { method: "PATCH", body: JSON.stringify({ manque: false }) });
  produits.forEach(p => p.manque = false);
  afficher();
  message("Liste remise à zéro");
}

// ===== Recette =====
let ingredients = [];

function normaliser(t) {
  return t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim().replace(/s$/, "");
}

async function extraire() {
  const texte = document.getElementById("texteRecette").value.trim();
  const zone = document.getElementById("resultatRecette");
  const bouton = document.getElementById("btnExtraire");
  if (!texte) { message("Colle d'abord une recette"); return; }
  bouton.disabled = true;
  document.getElementById("zoneAjout").style.display = "none";
  zone.innerHTML = '<div class="attente">⏳ Analyse de la recette en cours (10 à 30 secondes)…</div>';
  try {
    const r = await fetch(WEBHOOK_RECETTE, { method: "POST", body: new URLSearchParams({ recette: texte }) });
    const data = await r.json();
    const liste = Array.isArray(data.ingredients) ? data.ingredients : [];
    if (!liste.length) { zone.innerHTML = '<div class="attente">Aucun ingrédient trouvé. Réessaie dans un instant.</div>'; return; }
    ingredients = liste.map(i => {
      const existant = produits.find(p => normaliser(p.nom) === normaliser(i.nom || ""));
      const rayon = rayons.find(r => r.nom === i.rayon) || rayons.find(r => r.nom === "Divers");
      return { nom: i.nom, existant, rayon_id: existant ? existant.rayon_id : rayon.id };
    });
    afficherIngredients();
  } catch (e) {
    zone.innerHTML = '<div class="attente">❌ Le service ne répond pas. Réessaie plus tard.</div>';
  } finally {
    bouton.disabled = false;
  }
}

function afficherIngredients() {
  const opts = id => rayons.map(r => `<option value="${r.id}" ${r.id === id ? "selected" : ""}>${r.nom}</option>`).join("");
  let h = `<h2>Ingrédients trouvés (${ingredients.length})</h2><p>Décoche ce que tu as déjà.</p>`;
  ingredients.forEach((i, k) => {
    h += `<div class="ing"><input type="checkbox" id="ing${k}" checked><label class="nomIng" for="ing${k}">${echap(i.nom)}</label>`;
    h += i.existant ? `<span class="deja">déjà dans tes produits</span>` : `<select id="ray${k}">${opts(i.rayon_id)}</select>`;
    h += `</div>`;
  });
  document.getElementById("resultatRecette").innerHTML = h;
  document.getElementById("zoneAjout").style.display = "flex";
}

async function ajouterRecette() {
  const nomRecette = document.getElementById("nomRecette").value.trim();
  const ids = [];
  let n = 0;
  for (let k = 0; k < ingredients.length; k++) {
    const coche = document.getElementById("ing" + k).checked;
    const i = ingredients[k];
    let id;
    if (i.existant) {
      id = i.existant.id;
      if (coche && !i.existant.manque) await api("produits?id=eq." + id, { method: "PATCH", body: JSON.stringify({ manque: true }) });
    } else {
      // Nouveau produit : créé dans tous les cas pour que la recette le retienne ; coché = à acheter
      const rayon = Number(document.getElementById("ray" + k).value);
      const res = await api("produits", { method: "POST", headers: { Prefer: "return=representation" },
        body: JSON.stringify({ nom: i.nom, rayon_id: rayon, manque: coche }) });
      id = res[0].id;
    }
    ids.push(id);
    if (coche) n++;
  }
  if (nomRecette) await enregistrerRecette(nomRecette, ids);
  ingredients = [];
  document.getElementById("resultatRecette").innerHTML = "";
  document.getElementById("zoneAjout").style.display = "none";
  document.getElementById("texteRecette").value = "";
  document.getElementById("nomRecette").value = "";
  await charger();
  onglet("semaine");
  message(n + " ingrédient(s) ajouté(s) à ta semaine" + (nomRecette ? " — recette enregistrée" : ""));
}

// ===== Recettes enregistrées =====
async function chargerRecettes() {
  try {
    recettes = await api("recettes?select=id,nom,recette_produits(produit_id)&order=nom");
  } catch (e) { recettes = []; }
  afficherRecettes();
}

async function enregistrerRecette(nom, ids) {
  const deja = recettes.find(r => normaliser(r.nom) === normaliser(nom));
  let recetteId;
  if (deja) {
    recetteId = deja.id;
    await api("recette_produits?recette_id=eq." + recetteId, { method: "DELETE" });
  } else {
    const res = await api("recettes", { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify({ nom }) });
    recetteId = res[0].id;
  }
  const uniques = [...new Set(ids)];
  await api("recette_produits", { method: "POST", body: JSON.stringify(uniques.map(p => ({ recette_id: recetteId, produit_id: p }))) });
}

function afficherRecettes() {
  const zone = document.getElementById("listeRecettes");
  if (!recettes.length) { zone.innerHTML = '<div class="vide">Aucune recette enregistrée pour l\'instant.</div>'; document.getElementById("detailRecette").innerHTML = ""; return; }
  zone.innerHTML = recettes.map(r =>
    `<div class="rec"><button class="nomRec ${recetteOuverte === r.id ? "ouverte" : ""}" onclick="ouvrirRecette(${r.id})">📖 ${echap(r.nom)}</button>` +
    `<button class="suppr" onclick="supprimerRecette(${r.id})">🗑</button></div>`
  ).join("");
  afficherDetail();
}

function ouvrirRecette(id) {
  recetteOuverte = recetteOuverte === id ? null : id;
  afficherRecettes();
}

function afficherDetail() {
  const zone = document.getElementById("detailRecette");
  const r = recettes.find(x => x.id === recetteOuverte);
  if (!r) { zone.innerHTML = ""; return; }
  const liste = r.recette_produits.map(l => produits.find(p => p.id === l.produit_id)).filter(Boolean)
    .sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
  let h = `<div class="detail"><b>${echap(r.nom)}</b> — ${liste.length} ingrédient(s). Décoche ce que tu as déjà.`;
  liste.forEach(p => {
    h += `<div class="ing"><input type="checkbox" class="ingRec" value="${p.id}" id="rp${p.id}" checked><label class="nomIng" for="rp${p.id}">${echap(p.nom)}</label>` +
         (p.manque ? `<span class="deja">déjà dans ta semaine</span>` : "") + `</div>`;
  });
  h += `<div class="ligne"><button class="action" onclick="ajouterRecetteEnregistree()">Ajouter à ma semaine</button></div></div>`;
  zone.innerHTML = h;
}

async function ajouterRecetteEnregistree() {
  const ids = [...document.querySelectorAll(".ingRec:checked")].map(c => c.value);
  if (!ids.length) { message("Aucun ingrédient coché"); return; }
  await api("produits?id=in.(" + ids.join(",") + ")", { method: "PATCH", body: JSON.stringify({ manque: true }) });
  recetteOuverte = null;
  await charger();
  onglet("semaine");
  message(ids.length + " ingrédient(s) ajouté(s) à ta semaine");
}

async function supprimerRecette(id) {
  const r = recettes.find(x => x.id === id);
  if (!confirm("Supprimer la recette « " + r.nom + " » ? (tes produits restent)")) return;
  await api("recettes?id=eq." + id, { method: "DELETE" });
  if (recetteOuverte === id) recetteOuverte = null;
  await chargerRecettes();
}

charger();
</script>
</body>
</html>
